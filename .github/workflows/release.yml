name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build binaries
        run: make dist

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build Linux packages
        run: bash packaging/build-packages.sh

      - name: Build Entware package
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          VERSION="$version" \
          BINARY="dist/ext-tags_linux_amd64" \
          OUT="dist/ext-tags_${version}_x86-64.ipk" \
          bash packaging/opkg/build-ipk.sh

      - name: Verify static Linux binaries
        run: |
          set -euo pipefail
          file dist/ext-tags_linux_amd64
          if readelf -d dist/ext-tags_linux_amd64 | grep -q NEEDED; then
            echo "linux binary is dynamically linked" >&2
            exit 1
          fi

      - name: Package release assets
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p release
          for f in dist/ext-tags_*; do
            base="${f#dist/ext-tags_}"
            case "$f" in
              *.deb|*.rpm|*.apk|*.ipk) continue ;;
              *.exe)
                out="release/ext-tags_${version}_${base%.exe}.zip"
                zip -q -j "$out" "$f"
                ;;
              *)
                out="release/ext-tags_${version}_${base}.tar.gz"
                tar -czf "$out" -C dist "$(basename "$f")"
                ;;
            esac
          done
          cp dist/*.deb dist/*.rpm dist/*.apk dist/*.ipk release/
          cd release
          sha256sum ./* > SHA256SUMS
          ls -l

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

      - name: Update Entware feed
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          ipk="ext-tags_${version}_x86-64.ipk"
          feed_dir="$(mktemp -d)"
          git clone https://github.com/daregod/opkg-feed.git "$feed_dir"
          git -C "$feed_dir" remote set-url origin "https://x-access-token:${FEED_TOKEN}@github.com/daregod/opkg-feed.git"
          cd "$feed_dir"
          rm -f x86-64/ext-tags_*.ipk
          cp "$GITHUB_WORKSPACE/dist/$ipk" "x86-64/$ipk"
          size="$(stat -c%s "x86-64/$ipk")"
          sum="$(sha256sum "x86-64/$ipk" | cut -d' ' -f1)"
          cat > x86-64/Packages <<EOF
          Package: ext-tags
          Version: ${version}
          Architecture: x86-64
          Filename: ${ipk}
          Size: ${size}
          SHA256sum: ${sum}
          Description: Write and import foobar2000 external .tag files
          Section: utils
          Priority: optional
          Maintainer: Roman Dymchenko <daregod@users.noreply.github.com>
          License: MIT
          EOF
          gzip -kf x86-64/Packages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "opkg feed unchanged"
          else
            git commit -m "Update ext-tags to ${version}"
            git push origin main
          fi

      - name: Update Scoop and Homebrew manifests
        env:
          FEED_TOKEN: ${{ secrets.FEED_TOKEN }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          win_amd64="$(sha256sum dist/ext-tags_${version}_windows_amd64.zip | cut -d' ' -f1)"
          win_arm64="$(sha256sum dist/ext-tags_${version}_windows_arm64.zip | cut -d' ' -f1)"
          darwin_amd64="$(sha256sum dist/ext-tags_${version}_darwin_amd64.tar.gz | cut -d' ' -f1)"
          darwin_arm64="$(sha256sum dist/ext-tags_${version}_darwin_arm64.tar.gz | cut -d' ' -f1)"
          linux_amd64="$(sha256sum dist/ext-tags_${version}_linux_amd64.tar.gz | cut -d' ' -f1)"
          linux_arm64="$(sha256sum dist/ext-tags_${version}_linux_arm64.tar.gz | cut -d' ' -f1)"
          work="$(mktemp -d)"
          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__WINDOWS_AMD64__|${win_amd64}|g" \
            -e "s|__WINDOWS_ARM64__|${win_arm64}|g" \
            packaging/scoop/ext-tags.json.tmpl > "$work/ext-tags.json"
          sed \
            -e "s|__VERSION__|${version}|g" \
            -e "s|__DARWIN_AMD64__|${darwin_amd64}|g" \
            -e "s|__DARWIN_ARM64__|${darwin_arm64}|g" \
            -e "s|__LINUX_AMD64__|${linux_amd64}|g" \
            -e "s|__LINUX_ARM64__|${linux_arm64}|g" \
            packaging/homebrew/ext-tags.rb.tmpl > "$work/ext-tags.rb"

          git clone https://github.com/daregod/scoop-bucket.git "$work/scoop"
          cp "$work/ext-tags.json" "$work/scoop/bucket/ext-tags.json"
          git -C "$work/scoop" remote set-url origin "https://x-access-token:${FEED_TOKEN}@github.com/daregod/scoop-bucket.git"
          git -C "$work/scoop" config user.name "github-actions[bot]"
          git -C "$work/scoop" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$work/scoop" add -A
          if ! git -C "$work/scoop" diff --cached --quiet; then
            git -C "$work/scoop" commit -m "Update ext-tags to ${version}"
            git -C "$work/scoop" push origin main
          fi

          git clone https://github.com/daregod/homebrew-tap.git "$work/brew"
          cp "$work/ext-tags.rb" "$work/brew/Formula/ext-tags.rb"
          git -C "$work/brew" remote set-url origin "https://x-access-token:${FEED_TOKEN}@github.com/daregod/homebrew-tap.git"
          git -C "$work/brew" config user.name "github-actions[bot]"
          git -C "$work/brew" config user.email "github-actions[bot]@users.noreply.github.com"
          git -C "$work/brew" add -A
          if ! git -C "$work/brew" diff --cached --quiet; then
            git -C "$work/brew" commit -m "Update ext-tags to ${version}"
            git -C "$work/brew" push origin main
          fi
